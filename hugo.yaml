baseurl: https://jieyuhuayang.github.io/
languageCode: zh-cn
theme: hugo-theme-stack
title: 芥子观须弥


# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: zh-cn
DefaultContentLanguageInSubdir : false

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: true

services:
    # Change it to your Disqus shortname before using
    disqus:
        shortname: "hugo-theme-stack"
    # GA Tracking ID
    googleAnalytics:
        id:

pagination:
    pagerSize: 3

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    mainSections:  # 
        - post
    featuredImageField: image
    rssFullContent: true
    favicon:  # e.g.: favicon placed in `static/favicon.ico` of your site folder, then set this field to `/favicon.ico` (`/` is necessary)

    footer:
        since: 2023


    dateFormat:
        published: Jan 02, 2006
        lastUpdated: Jan 02, 2006 15:04 MST

    # 侧边栏
    sidebar: 
        subtitle: 政策/产业/资本学习者
        avatar:
            enabled: true
            local: true
            src: img/avatar.jpeg

    # 文章页面的配置
    article:
        math: false # 通过KaTeX启用数学支持
        toc: true
        readingTime: true


    comments:
        enabled: true
        provider: giscus

        disqusjs:
            shortname:
            apiUrl:
            apiKey:
            admin:
            adminLabel:

        giscus:
            repo: "jieyuhuayang/jieyuhuayang.github.io"
            repoID: MDEwOlJlcG9zaXRvcnkxNDg3MjYzNzQ=
            category: Announcements
            categoryID: DIC_kwDOCN1iZs4Ciqat
            mapping: pathname
            lightTheme: 0
            darkTheme: 1
            reactionsEnabled: 1
            emitMetadata: 0

    # widgets位于博客的右侧边栏。它们用于显示一些信息，例如类别、标签等。
    widgets:
        homepage:
            - type: search
            - type: archives # 显示年份列表以及每年发布的帖子数量。
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

    opengraph:
        twitter:
            # Your Twitter username
            site: A_Line_Walker

            # Available values: summary, summary_large_image
            card: summary_large_image

    defaultImage:
        opengraph:
            enabled: false
            local: false
            src:

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: auto

    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true

### Custom menu
### See https://stack.jimmycai.com/config/menu
### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
menu:
    main: []


    social:
        - identifier: WeChat
          name: 微信公众号
          url: https://mp.weixin.qq.com/s?__biz=MzAwMzkyMTM5NQ==&mid=2247487923&idx=1&sn=2f1f0edbab4639a0da48be616c2bf961&chksm=9b32952fac451c390f4a5a3f30e271b068e377c848fd62ead4b229afc2a5bb3d0b94cd6077bb#rd
          params:
              icon: brand-wechat
        
        - identifier: weibo
          name: weibo
          url: https://weibo.com/u/5740793059
          params:
              icon: brand-weibo

        - identifier: zhihu
          name: zhihu
          url: https://www.zhihu.com/people/jie-yu-hua-yang
          params:
              icon: brand-zhihu


        - identifier: X
          name: X
          url: https://twitter.com/A_Line_Walker
          params:
              icon: brand-X

        - identifier: github
          name: GitHub
          url: https://github.com/jieyuhuayang
          params:
              icon: brand-github

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4
